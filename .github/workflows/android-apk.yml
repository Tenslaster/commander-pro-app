# Commander PRO — production Android APK (standalone, not Expo Go)
# GitHub Actions (EAS free Android quota is often exhausted).
# Node-24 action majors avoid "Node.js 20 is deprecated" CI noise.

name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

# Least privilege for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions)
permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Install SDK packages (Expo 54 → compileSdk 36)
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          yes | sdkmanager --licenses || true

      - name: Install npm deps
        run: npm ci --no-fund --no-audit --loglevel=error

      - name: Expo prebuild Android (production)
        env:
          EXPO_PUBLIC_API_URL: https://crew.kingdom.forum/api
          NODE_ENV: production
        run: |
          set -euo pipefail
          echo "version=$(node -p "require('./app.json').expo.version")"
          echo "versionCode=$(node -p "require('./app.json').expo.android.versionCode")"
          npx expo prebuild --platform android --clean --no-install --non-interactive

      - name: Create debug keystore + patch release signing
        working-directory: android
        run: |
          set -euo pipefail
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keystore app/debug.keystore \
              -dname "CN=Commander PRO,O=Crew,C=CA"
          else
            echo "Using existing app/debug.keystore from prebuild"
          fi
          python3 ../scripts/ci-patch-android-signing.py

      - name: Gradle assembleRelease (standalone APK)
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: https://crew.kingdom.forum/api
          NODE_ENV: production
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Quiet Expo/RN upstream Kotlin deprecation spam (not fixable in app source)
          ./gradlew assembleRelease --no-daemon --warning-mode none \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Package APK
        run: |
          set -euo pipefail
          APK=$(find android -name "*.apk" \( -path "*/release/*" -o -path "*/outputs/*" \) | head -n 1)
          echo "Found $APK"
          ls -lah "$APK"
          cp "$APK" CommanderPro.apk
          echo "--- embedded app.config (version check) ---"
          unzip -p CommanderPro.apk assets/app.config 2>/dev/null | head -c 500 || true
          echo

      - uses: actions/upload-artifact@v6
        with:
          name: CommanderPro-apk
          path: CommanderPro.apk
          if-no-files-found: error
          retention-days: 30
