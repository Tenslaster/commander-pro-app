# Commander PRO APK (GitHub Actions — no EAS free Android quota)
# Actions → Android APK 1.3.8 → Run workflow → artifact CommanderPro-apk
#
# Action majors pin Node 24 runtimes (avoids "Node.js 20 is deprecated" warnings).

name: Android APK 1.3.8

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # v4 runs on Node 24 (v3 still targets Node 20 → yellow deprecation banner)
      - uses: android-actions/setup-android@v4

      - name: Install SDK packages (match Expo compileSdk 36)
        run: |
          set -euo pipefail
          # Expo 54 prebuild currently targets compileSdk/targetSdk 36
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          yes | sdkmanager --licenses || true

      - name: Install npm deps
        run: npm ci --no-fund --no-audit

      - name: Expo prebuild Android
        env:
          EXPO_PUBLIC_API_URL: https://crew.kingdom.forum/api
        run: npx expo prebuild --platform android --clean --no-install --non-interactive

      - name: Create debug keystore + patch release signing
        working-directory: android
        run: |
          set -euo pipefail
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keystore app/debug.keystore \
              -dname "CN=Commander PRO,O=Crew,C=CA"
          else
            echo "Using existing app/debug.keystore from prebuild"
          fi
          python3 ../scripts/ci-patch-android-signing.py

      - name: Gradle assembleRelease
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: https://crew.kingdom.forum/api
          NODE_ENV: production
        run: |
          set -euo pipefail
          chmod +x gradlew
          # --warning-mode none: dependency (Expo/RN) deprecations are not fixable in our scripts
          ./gradlew assembleRelease --no-daemon --warning-mode none

      - name: Package APK
        run: |
          set -euo pipefail
          APK=$(find android -name "*.apk" \( -path "*/release/*" -o -path "*/outputs/*" \) | head -n 1)
          echo "Found $APK"
          ls -lah "$APK"
          cp "$APK" CommanderPro.apk
          unzip -p CommanderPro.apk assets/app.config | head -c 400 || true
          echo

      # v6+ defaults to Node 24 (v5 still emitted Node 20 deprecation banners)
      - uses: actions/upload-artifact@v6
        with:
          name: CommanderPro-apk
          path: CommanderPro.apk
          if-no-files-found: error
          retention-days: 30
