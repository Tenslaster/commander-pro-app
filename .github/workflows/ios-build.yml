# Commander PRO IPA (GitHub Actions — unsigned; sign locally with Sideloadly)
# Bumps action majors to Node 24 runtimes (avoids "Node.js 20 is deprecated" noise).
# Expo prebuild + Release xcodebuild with production minify for smaller/faster JS.

name: iOS Build

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: true
        type: string
      ios_path:
        description: 'Path to iOS project (Expo prebuild uses ios/)'
        required: false
        type: string
        default: 'ios'
      scheme:
        description: 'Xcode scheme (auto from workspace if empty)'
        required: false
        type: string
        default: ''
      use_signing:
        description: 'Enable code signing (requires secrets)'
        required: false
        type: boolean
        default: false
      configuration:
        description: 'Debug is faster; Release for production IPA'
        required: false
        type: string
        default: 'Release'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      # Node-24-native action majors (same approach as Android APK workflow)
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore DerivedData cache
        uses: actions/cache/restore@v5
        id: cache-deriveddata
        with:
          path: DerivedData
          key: deriveddata-ios-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}
          restore-keys: |
            deriveddata-ios-${{ runner.os }}-

      - name: Detect project type
        id: detect
        run: |
          if [ -f "package.json" ] && grep -q '"expo"' package.json; then
            echo "type=expo" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ] && grep -q '"react-native"' package.json; then
            echo "type=reactnative" >> $GITHUB_OUTPUT
          else
            echo "type=native" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        if: steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo'
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-fund --no-audit
          else
            npm install --no-fund --no-audit
          fi

      - name: Expo prebuild iOS (production standalone — not Expo Go)
        if: steps.detect.outputs.type == 'expo'
        env:
          EXPO_PUBLIC_API_URL: https://crew.kingdom.forum/api
          NODE_ENV: production
          # Let Expo drive CocoaPods (avoids bare `pod install` deprecation notice path)
          CI: 'true'
        run: |
          set -euo pipefail
          echo "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL"
          echo "app version: $(node -p "require('./app.json').expo.version")"
          # Without --no-install Expo runs the recommended pod install flow
          npx expo prebuild --platform ios --clean --non-interactive
          if [ ! -d "ios" ]; then
            echo "ERROR: expo prebuild did not create ios/"
            exit 1
          fi
          ls -la ios

      - name: Restore CocoaPods repo cache only
        uses: actions/cache/restore@v5
        id: pods-cache
        with:
          # Do NOT restore ios/Pods over a fresh prebuild — stale Pods cause:
          # "sandbox is not in sync with the Podfile.lock"
          path: |
            ~/.cocoapods/repos
          key: cocoapods-repos-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            cocoapods-repos-${{ runner.os }}-

      - name: pod install (always after prebuild)
        if: steps.detect.outputs.type == 'expo'
        working-directory: ios
        run: |
          set -euo pipefail
          # Force a clean Pods tree so Manifest.lock always matches prebuild
          rm -rf Pods
          if command -v pod >/dev/null 2>&1; then
            pod install --repo-update=false || pod install
          else
            npx --yes pod-install
          fi
          test -d Pods
          test -f Podfile.lock
          echo "Pods OK ($(du -sh Pods | awk '{print $1}'))"

      - name: Install certificate and provisioning profile
        if: inputs.use_signing
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$IOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Build IPA
        env:
          BUILD_ID: ${{ inputs.build_id }}
          IOS_PATH: ${{ inputs.ios_path }}
          SCHEME: ${{ inputs.scheme }}
          PROJECT_TYPE: ${{ steps.detect.outputs.type }}
          USE_SIGNING: ${{ inputs.use_signing }}
          CONFIGURATION: ${{ inputs.configuration }}
          EXPO_PUBLIC_API_URL: https://crew.kingdom.forum/api
          # Production bundle: Hermes minify ON for Release (smaller + faster startup)
          NODE_ENV: production
          RCT_NO_LAUNCH_PACKAGER: '1'
        run: |
          set -euo pipefail
          export EXPO_PUBLIC_API_URL="${EXPO_PUBLIC_API_URL:-https://crew.kingdom.forum/api}"
          export NODE_ENV=production
          export RCT_NO_LAUNCH_PACKAGER=1

          if [ "$PROJECT_TYPE" = "expo" ] && [ -d "ios" ]; then
            IOS_PATH="ios"
          fi

          cd "$IOS_PATH"

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1 || true)
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1 || true)

          # Pods installed in dedicated step; re-run only if missing
          if [ -f "Podfile" ] && [ ! -d "Pods" ]; then
            echo "Pods missing — installing..."
            pod install || npx --yes pod-install
          fi
          # Sanity: Manifest.lock must match
          if [ -f "Podfile.lock" ] && [ -f "Pods/Manifest.lock" ]; then
            if ! diff -q Podfile.lock Pods/Manifest.lock >/dev/null; then
              echo "Manifest.lock drift — re-running pod install"
              rm -rf Pods
              pod install || npx --yes pod-install
            fi
          fi
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1 || true)

          if [ -z "${SCHEME:-}" ]; then
            if [ -n "${WORKSPACE:-}" ]; then
              SCHEME=$(basename "$WORKSPACE" .xcworkspace)
            elif [ -n "${PROJECT:-}" ]; then
              SCHEME=$(basename "$PROJECT" .xcodeproj)
            fi
          fi
          echo "Scheme=$SCHEME Configuration=$CONFIGURATION"

          DERIVED_DATA_PATH="${GITHUB_WORKSPACE}/DerivedData"

          BUILD_CMD=(xcodebuild)
          if [ -n "${WORKSPACE:-}" ]; then
            BUILD_CMD+=(-workspace "$WORKSPACE")
          elif [ -n "${PROJECT:-}" ]; then
            BUILD_CMD+=(-project "$PROJECT")
          fi
          BUILD_CMD+=(
            -scheme "$SCHEME"
            -configuration "$CONFIGURATION"
            -destination "generic/platform=iOS"
            -derivedDataPath "$DERIVED_DATA_PATH"
            COMPILER_INDEX_STORE_ENABLE=NO
            SWIFT_COMPILATION_MODE=wholemodule
          )

          if [ "$USE_SIGNING" = "true" ]; then
            BUILD_CMD+=(-archivePath ../build/App.xcarchive archive)
          else
            BUILD_CMD+=(
              CODE_SIGNING_ALLOWED=NO
              CODE_SIGN_IDENTITY=
              CODE_SIGNING_REQUIRED=NO
              build
            )
          fi

          echo "Running xcodebuild ($CONFIGURATION)..."
          set +e
          "${BUILD_CMD[@]}" 2>&1 | tee /tmp/xcodebuild.log
          XC=${PIPESTATUS[0]}
          set -e
          tail -n 60 /tmp/xcodebuild.log || true
          if [ "${XC}" -ne 0 ] || grep -q "\*\* BUILD FAILED \*\*" /tmp/xcodebuild.log; then
            echo "xcodebuild failed (exit=${XC})"
            grep -E "error:|BUILD FAILED" /tmp/xcodebuild.log | tail -n 50 || true
            exit 1
          fi
          if grep -q "\*\* BUILD SUCCEEDED \*\*" /tmp/xcodebuild.log; then
            echo "xcodebuild: BUILD SUCCEEDED"
          else
            echo "Note: BUILD SUCCEEDED marker not found; verifying .app exists next..."
          fi

          cd "${GITHUB_WORKSPACE}"
          mkdir -p build

          if [ "$USE_SIGNING" = "true" ]; then
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '    <key>method</key>' \
              '    <string>development</string>' \
              '    <key>signingStyle</key>' \
              '    <string>automatic</string>' \
              '</dict>' \
              '</plist>' > ExportOptions.plist
            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportOptionsPlist ExportOptions.plist \
              -exportPath build/export
            mv build/export/*.ipa "build/${BUILD_ID}.ipa"
          else
            APP_PATH=$(find "$DERIVED_DATA_PATH/Build/Products/${CONFIGURATION}-iphoneos" -name "*.app" -type d | head -1 || true)
            if [ -z "$APP_PATH" ]; then
              echo "Error: Could not find .app under $DERIVED_DATA_PATH"
              find "$DERIVED_DATA_PATH/Build/Products" -maxdepth 3 -type d 2>/dev/null || true
              exit 1
            fi
            echo "Found app at: $APP_PATH"
            # Show embedded version for QA
            if [ -f "$APP_PATH/app.config" ]; then
              head -c 400 "$APP_PATH/app.config" || true
              echo
            fi
            # Confirm JS bundle exists (Hermes / main.jsbundle)
            ls -lah "$APP_PATH" | head -n 40
            mkdir -p build/Payload
            cp -R "$APP_PATH" build/Payload/
            (
              cd build
              zip -rq "${BUILD_ID}.ipa" Payload
              rm -rf Payload
            )
            echo "Created unsigned IPA: build/${BUILD_ID}.ipa ($(ls -lh "build/${BUILD_ID}.ipa" | awk '{print $5}'))"
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: ipa
          path: build/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Save DerivedData cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: DerivedData
          key: deriveddata-ios-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json') }}

      - name: Save CocoaPods repo cache
        uses: actions/cache/save@v5
        if: always()
        with:
          path: |
            ~/.cocoapods/repos
          key: cocoapods-repos-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cleanup signing
        if: always() && inputs.use_signing
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Build summary
        if: always()
        env:
          USE_SIGNING: ${{ inputs.use_signing }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          echo "## iOS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID:** ${{ inputs.build_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration:** $CONFIGURATION" >> $GITHUB_STEP_SUMMARY
          echo "- **Node:** 24 (actions majors Node-24 native)" >> $GITHUB_STEP_SUMMARY
          echo "- **DerivedData Cache:** ${{ steps.cache-deriveddata.outputs.cache-hit == 'true' && 'Hit' || 'Miss' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pods Cache:** ${{ steps.pods-cache.outputs.cache-hit == 'true' && 'Hit' || 'Miss' }}" >> $GITHUB_STEP_SUMMARY
          if [ "$USE_SIGNING" = "true" ]; then
            echo "- **Signing:** Signed (development)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Signing:** Unsigned (Sideloadly / AltStore)" >> $GITHUB_STEP_SUMMARY
          fi
          if ls build/*.ipa 1>/dev/null 2>&1; then
            IPA_PATH=$(find build -name "*.ipa" -type f | head -1)
            echo "- **IPA Size:** $(ls -lh "$IPA_PATH" | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
          fi
