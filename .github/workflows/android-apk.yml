# Commander PRO 1.3.8 APK without EAS (free Android quota used until ~Aug 1).
# Actions → Android APK 1.3.8 → Run workflow → artifact CommanderPro-apk

name: Android APK 1.3.8

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"
          yes | sdkmanager --licenses || true

      - name: Install npm deps
        run: npm ci

      - name: Expo prebuild Android
        env:
          EXPO_PUBLIC_API_URL: https://crew.kingdom.forum/api
        run: npx expo prebuild --platform android --clean --no-install --non-interactive

      - name: Create debug keystore + patch release signing
        working-directory: android
        run: |
          set -euo pipefail
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keystore app/debug.keystore \
              -dname "CN=Commander PRO,O=Crew,C=CA"
          else
            echo "Using existing app/debug.keystore from prebuild"
          fi
          python3 ../scripts/ci-patch-android-signing.py

      - name: Gradle assembleRelease
        working-directory: android
        env:
          EXPO_PUBLIC_API_URL: https://crew.kingdom.forum/api
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Package APK
        run: |
          set -euo pipefail
          APK=$(find android -name "*.apk" \( -path "*/release/*" -o -path "*/outputs/*" \) | head -n 1)
          echo "Found $APK"
          ls -lah "$APK"
          cp "$APK" CommanderPro.apk
          unzip -p CommanderPro.apk assets/app.config | head -c 400 || true
          echo

      - uses: actions/upload-artifact@v5
        with:
          name: CommanderPro-apk
          path: CommanderPro.apk
          if-no-files-found: error
          retention-days: 30
